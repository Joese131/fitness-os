/* ============================================================
   ACCUEIL
   ============================================================ */
function viewHome() {
  const t = calcTargets();
  const d = today();
  const food = totals(recsOn('food', d));
  const water = sum(recsOn('water', d), w => w.ml);
  const wt = weightSeries();
  const lastW = wt.length ? wt[wt.length - 1] : null;
  const ra = rollingAvg(wt);
  const avg7 = ra.length ? ra[ra.length - 1] : null;
  const trend = weightTrend();
  const ww = weekWorkouts();
  const mand = S.core.program.filter(p => !p.optional);
  const doneMand = new Set(ww.filter(w => !(tplById(w.templateId) || {}).optional).map(w => w.templateId)).size;
  const rd = readinessToday();
  const nx = nextWorkout();
  const shA = shoulderAlerts();
  const pats = recoveryPatterns();
  const onb = onboardingItems();
  const onbDone = onb.filter(o => o.ok).length;
  const wkFrom = weekStart(d);
  const R = weekReview(wkFrom, d);
  const h = new Date().getHours();
  const hello = h < 5 ? 'Bonne nuit' : h < 18 ? 'Bonjour' : 'Bonsoir';
  let html = `<div class="view-head"><div><h1>${hello} ${esc(S.core.profile.name || '')}</h1><div class="sub">${fdateLong(d).replace(/^./, c => c.toUpperCase())}</div></div></div>`;
  for (const a of shA) html += alertBox(a.tone, a.text);
  if (window.FOS_PWA && /iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone) html += alertBox('info', `<b>Installe l\u2019app :</b> touche le bouton <b>Partager</b> de Safari, puis <b>« Sur l\u2019écran d\u2019accueil »</b>. Elle s\u2019ouvrira ensuite en plein écran, même sans connexion.`);
  if (Sync.state === 'local' && (!S.core.lastExport || daysBetween(S.core.lastExport.slice(0, 10), d) > 7) && (allRecs('workouts').length + allRecs('food').length) > 5)
    html += alertBox('warn', `Tes données sont uniquement ${window.FOS_PWA ? 'sur cet iPhone' : 'dans ce navigateur'}. <a href="#reglages" data-a="go" data-tab="reglages" data-sub="donnees">Fais une sauvegarde JSON</a>.`);

  // Prochaine séance
  if (S.core.active) {
    const a = S.core.active;
    const nd = sum(a.exercises, e => (e.sets || []).filter(s => s.done).length), nt = sum(a.exercises, e => (e.sets || []).length);
    html += `<div class="card glow"><div class="card-head"><h3>${IC.bolt} Séance en cours</h3><span class="meta">${nd}/${nt} séries</span></div><h2>${esc(a.name)}</h2><div class="muted small">Commencée à ${new Date(a.startedAt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</div><div class="row" style="margin-top:12px"><button class="btn primary lg block" data-a="go" data-tab="entrainement" data-sub="seance">${IC.play} Reprendre la séance</button></div></div>`;
  } else if (nx) {
    const tp = nx.tpl;
    html += `<div class="card glow"><div class="card-head"><h3>${IC.dumbbell} Prochaine séance</h3>${rd ? `<span class="chip ${rd.tone === 'good' ? 'green' : rd.tone === 'warn' ? 'est' : 'red'}">Récup. ${rd.label} · ${rd.score}</span>` : `<span class="chip click" data-a="quick-checkin">Check-in du jour →</span>`}</div>
      <h2>${esc(tp.name)} <span class="muted" style="font-weight:500">— ${esc(tp.sub)}</span></h2>
      <div class="muted small" style="margin-top:3px">Prévue ${esc(nx.when)} · ≈ ${tplDuration(tp)} min · ${sum(tp.ex, e => e.sets)} séries · ${S.core.profile.trainTime}</div>
      ${nx.optional && rd && rd.score < 70 ? alertBox('warn', 'Récupération insuffisante pour la séance facultative aujourd’hui : repose-toi.') : ''}
      ${rd && rd.score < 45 && !nx.optional ? alertBox('warn', rd.advice) : ''}
      <div class="row" style="margin-top:12px"><button class="btn primary lg" style="flex:1" data-a="start-workout" data-id="${tp.id}">${IC.play} Démarrer</button><button class="btn lg" data-a="go" data-tab="entrainement" data-sub="semaine">Plan</button></div></div>`;
  } else {
    html += `<div class="card glow"><h3>${IC.check} Semaine d’entraînement terminée</h3><p class="text2">Toutes les séances prévues sont faites. Profite du repos : la récupération fait partie du programme.</p></div>`;
  }

  // Actions rapides
  html += `<div class="quick-actions" style="margin-bottom:14px">
    <button class="qa" data-a="add-food" data-meal="">${IC.food}Repas</button>
    <button class="qa" data-a="scan" data-meal="">${IC.camera}Scanner</button>
    <button class="qa" data-a="quick-checkin">${IC.moon}Check-in</button>
    <button class="qa" data-a="quick-weight">${IC.scale}Pesée</button></div>`;

  // Nutrition du jour
  const kp = t.cur.kcal ? food.kcal / t.cur.kcal : 0;
  html += `<div class="card"><div class="card-head"><h3>${IC.food} Aujourd’hui</h3><button class="btn xs" data-a="go" data-tab="nutrition" data-sub="journal">Journal →</button></div>
    <div class="row" style="gap:16px;align-items:center">
      ${ringSVG(118, 11, kp, 'var(--accent)', `<div style="font-size:1.35rem;font-weight:720" class="num">${fmt(food.kcal)}</div><div class="muted" style="font-size:.7rem">/ ${fmt(t.cur.kcal)} kcal</div>`)}
      <div style="flex:1;min-width:0">
        <div class="row between"><span class="small muted" style="font-weight:600">Protéines</span><span class="num"><b style="font-size:1.25rem">${fmt(food.p)}</b><span class="muted"> / ${t.cur.p} g</span></span></div>
        ${barHTML(food.p, t.cur.p, 'prot lg')}
        <div class="row between" style="margin-top:8px"><span class="small muted">Glucides</span><span class="small num">${fmt(food.c)} / ${t.cur.c} g</span></div>${barHTML(food.c, t.cur.c, 'carb')}
        <div class="row between" style="margin-top:6px"><span class="small muted">Lipides</span><span class="small num">${fmt(food.f)} / ${t.cur.f} g</span></div>${barHTML(food.f, t.cur.f, 'fat')}
        <div class="row between" style="margin-top:6px"><span class="small muted">Eau</span><span class="small num">${fmt(water / 1000, 1)} / ${fmt(waterTarget(d) / 1000, 1)} L</span></div>${barHTML(water, waterTarget(d))}
      </div></div>
    <div class="small muted" style="margin-top:10px">Reste : <b class="text2">${fmt(Math.max(0, t.cur.kcal - food.kcal))} kcal</b> et <b class="text2">${fmt(Math.max(0, t.cur.p - food.p))} g de protéines</b>. ${TAGS.est}</div></div>`;

  // Stats
  html += `<div class="grid g4" style="margin-bottom:14px">
    <div class="stat"><div class="label">${IC.scale.replace('<svg', '<svg width="14" height="14"')} Poids</div><div class="value num">${lastW ? fmt1(lastW.kg) : fmt1(S.core.profile.weight)}<small>kg</small></div><div class="foot">${avg7 && avg7.n >= 3 ? `Moy. 7 j : ${fmt(avg7.v, 1)} kg` : lastW ? `Pesée du ${fdate(lastW.date)}` : 'Profil (pas de pesée)'}</div></div>
    <div class="stat"><div class="label">Tendance hebdo</div><div class="value num">${trend ? (trend.delta >= 0 ? '+' : '') + fmt(trend.delta, 2) : '–'}<small>kg</small></div><div class="foot">${trend ? (trend.reliable ? (Math.abs(trend.delta) < 0.2 ? 'Stable (variation normale)' : 'Moyenne vs sem. précédente') : 'Peu fiable (< 3 pesées/sem.)') : '2 semaines de pesées requises'}</div></div>
    <div class="stat"><div class="label">Séances semaine</div><div class="value num">${doneMand}<small>/ ${mand.length}</small></div><div class="foot">${Math.round(doneMand / mand.length * 100)} % du plan${ww.some(w => (tplById(w.templateId) || {}).optional) ? ' + facultative' : ''}</div></div>
    <div class="stat"><div class="label">Récupération</div><div class="value">${rd ? rd.score : '–'}<small>${rd ? '/100' : ''}</small></div><div class="foot">${rd ? rd.label : '<a data-a="quick-checkin" href="#">Faire le check-in</a>'}</div></div></div>`;

  for (const p of pats.items) html += alertBox(p.tone, `<b>${esc(p.text)}</b><br>${esc(p.action)}`);

  // Indicateurs de la semaine
  html += `<div class="card"><div class="card-head"><h3>${IC.chart} Cette semaine</h3><span class="meta">depuis lundi</span></div>
    <div class="list">
      <div class="li"><div class="main"><div class="title">Jours avec protéines ≥ 90 %</div><div class="sub">${R.days.length} jour(s) notés</div></div><div class="right"><b>${R.protHit}</b> / ${R.days.length || 0}</div></div>
      <div class="li"><div class="main"><div class="title">Calories moyennes</div><div class="sub">jours notés uniquement</div></div><div class="right">${R.avgK != null ? fmt(R.avgK) + ' kcal' : '–'}</div></div>
      <div class="li"><div class="main"><div class="title">Repas fast-food</div><div class="sub">objectif progressif ≤ ${S.core.targets.fastfoodWk}</div></div><div class="right"><b>${R.ffMeals}</b></div></div>
      <div class="li"><div class="main"><div class="title">Budget alimentaire</div><div class="sub">${fmt(S.core.budget.weekly)} € / semaine</div></div><div class="right">${fmt(R.foodSpend, 2)} €</div></div>
      <div class="li"><div class="main"><div class="title">Sommeil moyen</div><div class="sub">repère ≥ ${S.core.targets.sleepH} h</div></div><div class="right">${R.avgSleep != null ? fmt1(R.avgSleep) + ' h' : '–'}</div></div>
      <div class="li"><div class="main"><div class="title">Pas moyens</div><div class="sub">saisie manuelle</div></div><div class="right">${R.steps ? fmt(R.steps) : '–'}</div></div>
    </div><button class="btn block" style="margin-top:10px" data-a="go" data-tab="progres" data-sub="bilan">Bilan & coach de la semaine →</button></div>`;

  // Poids 30 j
  html += `<div class="card"><div class="card-head"><h3>Poids — 30 jours</h3><button class="btn xs" data-a="go" data-tab="progres" data-sub="poids">Détails</button></div><div id="home-weight"></div></div>`;

  // Onboarding
  if (!S.core.onb.dismissed && onbDone < onb.length) {
    html += `<div class="card"><div class="card-head"><h3>Pour bien démarrer</h3><span class="meta">${onbDone}/${onb.length}</span></div>${barHTML(onbDone, onb.length)}
      <div style="margin-top:8px">${onb.map(o => `<div class="onb-item ${o.ok ? 'ok' : ''}"><div class="ck">${o.ok ? IC.check : ''}</div><div style="flex:1"><a href="#" class="ot" data-a="${o.act}" style="color:${o.ok ? 'var(--muted)' : 'var(--text)'}">${esc(o.t)}</a></div></div>`).join('')}</div>
      <button class="btn ghost sm" data-a="onb-dismiss">Masquer cette liste</button></div>`;
  }
  html += `<div class="card tight"><div class="small muted">Légende : ${TAGS.ev} recommandation scientifique · ${TAGS.coach} conseil pratique · ${TAGS.est} valeur estimée · ${TAGS.hyp} hypothèse à confirmer. Cette app ne remplace pas un avis médical.</div></div>`;
  return { html, after() {
    const s = wt.filter(p => p.date >= addDays(d, -30));
    const ra30 = rollingAvg(wt).filter(p => p.date >= addDays(d, -30) && p.n >= 2);
    lineChart($('#home-weight'), { height: 150, series: [
      { name: 'Pesée', color: 'var(--s-prot)', pts: s.map(p => ({ x: p.date, y: p.kg })), line: false, r: 3.5, dotOpacity: .55 },
      { name: 'Moyenne 7 j', color: '#8fb6ff', pts: ra30.map(p => ({ x: p.date, y: p.v })), dots: false, width: 2.2 }
    ], unit: 'kg', yFmt: v => fmt1(v), empty: 'Ajoute tes pesées pour voir la tendance (idéalement 3–4 par semaine, le matin à jeun).' });
  } };
}

/* ============================================================
   ENTRAÎNEMENT
   ============================================================ */
function viewTraining() {
  const sub = UI.sub.entrainement;
  const items = [['semaine', 'Semaine'], ...(S.core.active ? [['seance', '● Séance']] : []), ['programme', 'Programme'], ['exercices', 'Exercices'], ['historique', 'Historique'], ['rir', 'Guide RIR']];
  let body;
  if (sub === 'seance' && S.core.active) body = viewActiveWorkout();
  else if (sub === 'programme') body = viewProgram();
  else if (sub === 'exercices') body = viewLibrary();
  else if (sub === 'historique') body = viewHistory();
  else if (sub === 'rir') body = viewRIR();
  else { UI.sub.entrainement = 'semaine'; body = viewWeek(); }
  return { html: `<div class="view-head"><div><h1>Entraînement</h1><div class="sub">4 séances + 1 facultative · surcharge progressive</div></div></div>` + seg('entrainement', items, UI.sub.entrainement) + body.html, after: body.after };
}

function viewWeek() {
  const t = today(), ws = weekStart(t);
  const done = weekWorkouts(t);
  let cal = '<div class="week">';
  for (let i = 1; i <= 7; i++) {
    const date = addDays(ws, i - 1);
    const plan = S.core.program.filter(p => p.day === i);
    const dw = done.filter(w => w.date === date);
    let tags = dw.map(w => `<span class="tag done">${esc(w.templateId || '✓')} ✓</span>`).join('');
    for (const p of plan) if (!dw.some(w => w.templateId === p.id)) tags += `<span class="tag ${p.optional ? 'opt' : 'plan'}">${p.id}${p.optional ? '?' : ''}</span>`;
    if (i === 6 && !plan.length) tags += `<span class="tag" title="Travail debout">Travail</span>`;
    cal += `<div class="day ${date === t ? 'today' : ''}"><div class="dn">${DOW[i]}</div><div class="dd">${pd(date).getDate()}</div>${tags}</div>`;
  }
  cal += '</div>';
  const nx = nextWorkout();
  const rd = readinessToday();
  let html = `<div class="card">${cal}<div class="small muted" style="margin-top:10px">A–D : séances obligatoires (mar., mer., jeu., dim. à ${S.core.profile.trainTime}) · E : facultative · Samedi : travail debout, pas de séance.</div></div>`;
  if (S.core.active) html += alertBox('info', `Séance en cours : <b>${esc(S.core.active.name)}</b>. <a href="#" data-a="seg" data-k="entrainement" data-v="seance">Reprendre →</a>`);
  html += alertBox('info', `<b>Séance manquée ?</b> Ne la rattrape pas en doublant. Fais simplement la suivante du plan au prochain créneau : la régularité sur plusieurs semaines compte plus qu’une séance. ${TAGS.coach}`);
  if (rd && rd.score < 45) html += alertBox('warn', `Récupération faible aujourd’hui (${rd.score}/100) : ${rd.advice}`);
  for (const tp of S.core.program) {
    const isDone = done.some(w => w.templateId === tp.id);
    const isNext = nx && nx.tpl.id === tp.id;
    const shCount = tp.ex.filter(e => exInfo(e.id).sh !== 'green').length;
    html += `<div class="card ${isNext ? 'glow' : ''}"><div class="card-head"><div><h3><span class="pill-num">${tp.id}</span> ${esc(tp.name)}</h3><div class="muted small" style="margin-top:3px">${esc(tp.sub)} · ${tp.optional ? 'facultative · ' : ''}${DOW_LONG[tp.day]} · ≈ ${tplDuration(tp)} min · ${sum(tp.ex, e => e.sets)} séries</div></div>${isDone ? '<span class="chip green">Faite ✓</span>' : isNext ? '<span class="chip ev">Suivante</span>' : ''}</div>
      <div class="small text2">${tp.ex.map(e => `<span style="white-space:nowrap"><span class="sh-dot ${exInfo(e.id).sh}"></span> ${esc(exInfo(e.id).name)}</span>`).join(' · ')}</div>
      ${shCount ? `<div class="small muted" style="margin-top:6px">${shCount} exercice(s) orange : charge modérée, RIR ≥ 2–3, remplace si douleur.</div>` : ''}
      <div class="row" style="margin-top:12px"><button class="btn ${isNext ? 'primary' : ''} sm" data-a="start-workout" data-id="${tp.id}" ${S.core.active ? 'disabled' : ''}>${IC.play} Démarrer</button><button class="btn sm ghost" data-a="go" data-tab="entrainement" data-sub="programme">Modifier</button></div></div>`;
  }
  const wm = setsByMuscle(done), pm = plannedSetsByMuscle(false);
  html += `<div class="card"><div class="card-head"><h3>Volume de la semaine</h3><span class="meta">séries effectives / prévues</span></div>${volumeRows(wm, pm)}
    <div class="small muted" style="margin-top:8px">Trait vertical = 10 séries (repère ACSM 2026 pour l’hypertrophie) ${TAGS.ev}. Séries « secondaires » comptées 0,5. Les épaules (avant/côté) ne sont pas travaillées en direct à cause de la tendinopathie.</div></div>`;
  return { html };
}
function volumeRows(done, planned) {
  const keys = ['quads', 'glutes', 'hams', 'biceps', 'triceps', 'abs', 'back', 'chest', 'calves', 'rear', 'traps'];
  const max = Math.max(20, ...keys.map(k => Math.max(done[k] || 0, planned ? planned[k] || 0 : 0)));
  return keys.map(k => {
    const v = done[k] || 0, p = planned ? planned[k] || 0 : null;
    return `<div class="vol-row"><span class="${PRIORITY_MUSCLES.includes(k) ? '' : 'muted'}">${MUSCLES[k]}${PRIORITY_MUSCLES.includes(k) ? ' ★' : ''}</span><div class="vbar"><span class="${PRIORITY_MUSCLES.includes(k) ? 'prio' : ''}" style="width:${v / max * 100}%"></span>${p != null ? `<span style="width:${p / max * 100}%;background:transparent;border:1px dashed var(--line-2);border-radius:4px"></span>` : ''}<i class="mark" style="left:${10 / max * 100}%"></i></div><span class="num right small">${fmt1(v)}${p != null ? '<span class="muted">/' + fmt1(p) + '</span>' : ''}</span></div>`;
  }).join('');
}

/* ---------- Séance en cours ---------- */
function viewActiveWorkout() {
  const a = S.core.active;
  const rd = readinessToday();
  const tpl = tplById(a.templateId) || {};
  let html = `<div class="wk-head"><div class="row between"><div style="min-width:0"><div class="small muted">${esc(a.name)}</div><div class="wk-timer" id="wk-timer">${fmtDur((Date.now() - a.startedAt) / 1000)}</div></div>
    <div class="row"><button class="btn sm ghost" data-a="wk-cancel">Abandonner</button><button class="btn sm good" data-a="wk-finish">${IC.check} Terminer</button></div></div></div>`;
  if (rd && rd.score < 45) html += alertBox('warn', `Récupération faible (${rd.score}/100) : garde les charges, RIR +1, retire une série par exercice si besoin.`);
  else if (!rd) html += alertBox('info', `Pas de check-in aujourd’hui. <a href="#" data-a="quick-checkin">Le faire (30 s)</a> pour adapter les conseils.`);
  if (tpl.warmup) html += `<details class="acc"><summary>Échauffement</summary><div class="acc-body">${esc(tpl.warmup)}</div></details>`;
  a.exercises.forEach((ex, i) => {
    const info = exInfo(ex.exId);
    const sg = suggestFor(ex.exId, ex.target);
    const allDone = ex.sets.length && ex.sets.every(s => s.done);
    const pain = ex.pain;
    html += `<div class="ex-card ${allDone ? 'done' : ''}" id="ex-${i}"><div class="ex-title"><div class="row" style="gap:10px;align-items:flex-start;min-width:0"><div data-a="ex-info" data-id="${ex.exId}" style="cursor:pointer" title="Voir l\u2019illustration et les consignes">${illuThumb(ex.exId, 58)}</div><div style="min-width:0"><h3>${i + 1}. ${esc(info.name)}</h3><div class="ex-target">${ex.target.sets} × ${ex.target.lo}–${ex.target.hi} reps · RIR ${ex.target.rir} · repos ${fmtDur(ex.target.rest)}</div><div style="margin-top:5px">${shChip(info.sh)}</div></div></div></div>
      ${info.sh === 'red' ? alertBox('crit', `Exercice signalé pour l’épaule (${esc(info.flagReason || info.note || 'exclu')}). Remplace-le.`) : ''}
      <div class="ex-hint"><div style="margin-bottom:6px">${verdictChip(sg.v)}</div>${sg.text}</div>
      <div class="set-row head"><span>#</span><span>kg</span><span>reps</span><span>RIR</span><span></span></div>`;
    ex.sets.forEach((s, j) => {
      html += `<div class="set-row ${s.done ? 'done' : ''}"><div class="n">${j + 1}</div>
        <input type="text" inputmode="decimal" data-c="set-w" data-i="${i}" data-j="${j}" value="${s.w ?? ''}" placeholder="${sg.weight != null ? fmt1(sg.weight) : 'kg'}">
        <input type="text" inputmode="numeric" data-c="set-r" data-i="${i}" data-j="${j}" value="${s.reps ?? ''}" placeholder="${ex.target.lo}–${ex.target.hi}">
        <div class="rir-pick">${[0, 1, 2, 3, 4].map(v => `<button type="button" data-a="set-rir" data-i="${i}" data-j="${j}" data-v="${v}" class="${s.rir === v ? 'on' : ''}">${v === 4 ? '4+' : v}</button>`).join('')}</div>
        <button type="button" class="check-btn ${s.done ? 'on' : ''}" data-a="set-done" data-i="${i}" data-j="${j}" aria-label="Valider la série">${IC.check}</button></div>`;
    });
    html += `<div class="row wrap" style="margin-top:8px;gap:6px"><button class="btn xs" data-a="set-add" data-i="${i}">${IC.plus} Série</button>${ex.sets.length > 1 ? `<button class="btn xs ghost" data-a="set-del" data-i="${i}">– Série</button>` : ''}<button class="btn xs" data-a="wk-swap" data-i="${i}">${IC.swap} Remplacer</button><button class="btn xs ${pain ? 'danger' : ''}" data-a="wk-pain" data-i="${i}">Épaule${pain ? ' ' + pain + '/10' : ''}</button><button class="btn xs ghost" data-a="ex-info" data-id="${ex.exId}">Technique</button></div>
      ${ex.note ? `<div class="small muted" style="margin-top:6px">Note : ${esc(ex.note)}</div>` : ''}</div>`;
  });
  html += `<div class="row" style="gap:8px;margin:6px 0 10px"><button class="btn sm" data-a="wk-add-ex">${IC.plus} Ajouter un exercice</button></div>
    <button class="btn primary lg block" data-a="wk-finish">${IC.check} Terminer la séance</button>
    <p class="small muted" style="text-align:center;margin-top:8px">Les séries sont enregistrées au fur et à mesure (tu peux fermer l’app et revenir).</p>`;
  return { html };
}

/* ---------- Programme ---------- */
function viewProgram() {
  let html = alertBox('info', `<b>Règles de progression</b> ${TAGS.coach}<br>1) Double progression : reste sur une charge jusqu’à faire le haut de la fourchette de reps sur toutes les séries, au RIR visé, avec une technique propre. 2) Ensuite, augmente du plus petit incrément (1–2,5 kg selon l’exercice). 3) Pas d’augmentation si : douleur d’épaule récente (≥ 3/10), récupération faible, ou technique qui se dégrade. 4) Deux séances de suite sous la fourchette : baisse de ≈ 10 %.`);
  html += `<details class="acc"><summary>Pourquoi ce programme ? Ce qui est prouvé, ce qui est un choix</summary><div class="acc-body">
    <p><b>Aucun programme n\u2019est « prouvé meilleur » pour une personne donnée.</b> La recherche valide des principes ; le programme les applique à tes contraintes. ${TAGS.ev}</p>
    <p><b>Appuyé par les données :</b> chaque muscle travaillé ≥ 2×/semaine et ≈ 10 séries/muscle/semaine pour l\u2019hypertrophie (ACSM 2026) ; arrêt à 1–3 reps de l\u2019échec (Refalo 2023) ; repos > 60 s (Singer 2024) ; surcharge progressive ; plus de volume aide mais avec des rendements décroissants (Pelland 2024).</p>
    <p><b>Choix de coaching</b> ${TAGS.coach} : le split haut/bas adapté à tes 3 jours consécutifs, le choix des exercices, un volume de départ modéré (séances ≈ 55–65 min) parce que tu dors 5–7 h et gardes des courbatures plusieurs jours, et des pectoraux limités à ≈ 8 séries à cause de l\u2019épaule.</p>
    <p><b>Compromis assumé :</b> pas de travail direct des deltoïdes (élévations latérales exclues). Tes épaules grossiront moins vite que le reste ; à rediscuter avec un kiné.</p>
    <p><b>Le vrai test :</b> la régularité (« le meilleur programme est celui que tu suis », ACSM 2026) et tes propres données sur 8–12 semaines. Le bilan hebdo proposera d\u2019ajouter des séries si ta récupération le permet.</p></div></details>`;
  html += alertBox('info', `<b>Volume</b> ${TAGS.ev} ≈ 10 séries par muscle et par semaine minimum pour l’hypertrophie (ACSM 2026), plus pour les priorités. L’échec musculaire n’est pas nécessaire : RIR 1–3 selon l’exercice.`);
  for (const tp of S.core.program) {
    html += `<div class="card"><div class="card-head"><div><h3><span class="pill-num">${tp.id}</span> ${esc(tp.name)}</h3><div class="muted small">${esc(tp.sub)} · ≈ ${tplDuration(tp)} min</div></div>
      <select style="width:auto;min-height:36px;font-size:.85rem" data-c="tpl-day" data-id="${tp.id}">${[1, 2, 3, 4, 5, 6, 7].map(i => `<option value="${i}" ${tp.day === i ? 'selected' : ''}>${DOW_LONG[i]}</option>`).join('')}</select></div>
      <div class="list">${tp.ex.map((e, i) => { const info = exInfo(e.id); return `<div class="li"><div data-a="ex-info" data-id="${e.id}" style="cursor:pointer">${illuThumb(e.id, 50)}</div><div class="main"><div class="title"><span class="sh-dot ${info.sh}"></span> ${esc(info.name)}</div><div class="sub">${e.sets} × ${e.lo}–${e.hi} · RIR ${e.rir} · repos ${fmtDur(e.rest)}${info.sh === 'red' ? ' · <b style="color:#ff9a9d">signalé épaule</b>' : ''}</div></div>
        <div class="row" style="gap:4px"><button class="icon-btn" style="width:32px;height:32px" data-a="tpl-move" data-id="${tp.id}" data-i="${i}" data-d="-1" aria-label="Monter">${IC.up}</button><button class="icon-btn" style="width:32px;height:32px" data-a="tpl-move" data-id="${tp.id}" data-i="${i}" data-d="1" aria-label="Descendre">${IC.down}</button><button class="icon-btn" style="width:32px;height:32px" data-a="tpl-edit" data-id="${tp.id}" data-i="${i}" aria-label="Modifier">${IC.edit}</button></div></div>`; }).join('')}</div>
      <button class="btn sm" style="margin-top:8px" data-a="tpl-add" data-id="${tp.id}">${IC.plus} Ajouter un exercice</button></div>`;
  }
  html += `<div class="card"><div class="card-head"><h3>Volume prévu par muscle</h3><span class="meta">4 séances obligatoires</span></div>${volumeRows(plannedSetsByMuscle(false), null)}
    <div class="small muted" style="margin-top:6px">Avec la séance facultative : biceps ${fmt1(plannedSetsByMuscle(true).biceps)}, triceps ${fmt1(plannedSetsByMuscle(true).triceps)}, fessiers ${fmt1(plannedSetsByMuscle(true).glutes)}, abdos ${fmt1(plannedSetsByMuscle(true).abs)} séries.</div></div>
    <button class="btn danger sm" data-a="tpl-reset">Réinitialiser le programme par défaut</button>`;
  return { html };
}

/* ---------- Bibliothèque d'exercices ---------- */
function viewLibrary() {
  const q = (UI.libQ || '').toLowerCase();
  const mf = UI.libM || 'all';
  const all = Object.keys(EXERCISES).concat(Object.keys(S.core.customExercises)).map(exInfo);
  const list = all.filter(e => (!q || e.name.toLowerCase().includes(q)) && (mf === 'all' || (e.p || []).includes(mf) || (e.s || []).includes(mf)));
  const order = { green: 0, orange: 1, red: 2 };
  list.sort((a, b) => order[a.sh] - order[b.sh] || a.name.localeCompare(b.name));
  let html = `<div class="card tight"><input type="search" placeholder="Rechercher un exercice…" value="${esc(UI.libQ || '')}" data-c="lib-q">
    <div class="row wrap" style="gap:6px;margin-top:10px">${[['all', 'Tous'], ...Object.entries(MUSCLES)].map(([k, l]) => `<span class="chip click ${mf === k ? 'ev' : ''}" data-a="lib-m" data-v="${k}">${l}</span>`).join('')}</div></div>`;
  html += `<div class="small muted" style="margin:0 2px 10px">${shChip('green')} ${shChip('orange')} ${shChip('red')}</div>`;
  html += `<div class="card"><div class="list">${list.map(e => `<div class="li click" data-a="ex-info" data-id="${e.id}">${illuThumb(e.id, 58)}<div class="main"><div class="title"><span class="sh-dot ${e.sh}"></span> ${esc(e.name)}</div><div class="sub">${(e.p || []).map(m => MUSCLES[m]).join(', ')}${(e.s || []).length ? ' · ' + e.s.map(m => MUSCLES[m]).join(', ') : ''} · ${esc(e.eq || '')}</div></div><span class="muted">${IC.right.replace('<svg', '<svg width="16" height="16"')}</span></div>`).join('') || '<div class="empty">Aucun exercice</div>'}</div></div>
    <button class="btn sm" data-a="custom-ex">${IC.plus} Exercice personnalisé</button>`;
  return { html };
}

/* ---------- Historique ---------- */
function viewHistory() {
  const ws = allRecs('workouts').slice().reverse();
  const exIds = [...new Set(allRecs('workouts').flatMap(w => (w.exercises || []).filter(e => doneSets(e).length).map(e => e.exId)))];
  if (!UI.histEx || !exIds.includes(UI.histEx)) UI.histEx = exIds[0] || null;
  let html = '';
  html += `<div class="card"><div class="card-head"><h3>Progression d’un exercice</h3></div>${exIds.length ? `<select data-c="hist-ex">${exIds.map(id => `<option value="${id}" ${id === UI.histEx ? 'selected' : ''}>${esc(exInfo(id).name)}</option>`).join('')}</select><div id="hist-chart" style="margin-top:10px"></div><div class="small muted">1RM estimé = charge × (1 + (reps + RIR) / 30) (formule d’Epley ajustée au RIR) ${TAGS.est}. Utile pour suivre une tendance, pas pour tester un maximum.</div>` : '<div class="empty">Termine une séance pour voir ta progression.</div>'}</div>`;
  // Records
  const prs = exIds.map(id => ({ id, pr: prFor(id) })).filter(x => x.pr).sort((a, b) => exInfo(a.id).name.localeCompare(exInfo(b.id).name));
  html += `<div class="card"><div class="card-head"><h3>Records personnels</h3><span class="meta">meilleur 1RM estimé</span></div>${prs.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Exercice</th><th class="n">Série</th><th class="n">1RM est.</th><th>Date</th></tr></thead><tbody>${prs.map(x => `<tr><td>${esc(exInfo(x.id).name)}</td><td class="n">${fmt1(x.pr.w)} × ${x.pr.reps}</td><td class="n">${fmt1(x.pr.v)} kg</td><td>${fdate(x.pr.date)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Pas encore de records : ils apparaîtront après tes premières séances.</div>'}</div>`;
  html += `<div class="card"><div class="card-head"><h3>Séances passées</h3><span class="meta">${ws.length}</span></div><div class="list">${ws.map(w => `<div class="li click" data-a="wk-detail" data-id="${w.id}"><div class="main"><div class="title">${esc(w.name)}</div><div class="sub">${fdateLong(w.date)} · ${w.durationMin ? w.durationMin + ' min · ' : ''}${sum(w.exercises || [], e => doneSets(e).length)} séries · ${fmt(volumeLoad(w))} kg soulevés${w.prs && w.prs.length ? ' · 🏆 ' + w.prs.length : ''}</div></div><span class="muted">${IC.right.replace('<svg', '<svg width="16" height="16"')}</span></div>`).join('') || '<div class="empty">Aucune séance enregistrée.</div>'}</div></div>`;
  return { html, after() {
    if (!UI.histEx) return;
    const h = exHistory(UI.histEx);
    lineChart($('#hist-chart'), { height: 170, unit: 'kg', series: [
      { name: '1RM estimé', color: 'var(--s-prot)', pts: h.filter(x => x.best).map(x => ({ x: x.date, y: x.best })) },
      { name: 'Charge max', color: 'var(--s-fat)', pts: h.filter(x => x.topW).map(x => ({ x: x.date, y: x.topW })) }
    ], empty: 'Une séance de plus et la courbe apparaît.' });
  } };
}

/* ---------- Guide RIR ---------- */
function viewRIR() {
  const html = `<div class="card glow"><h2>Le RIR en 1 minute</h2><p class="text2"><b>RIR = Répétitions En Réserve</b> (« Reps In Reserve ») : à la fin d’une série, combien de répétitions <b>propres</b> aurais-tu encore pu faire ? ${TAGS.ev}</p>
    <div class="table-wrap" style="margin-top:10px"><table class="t"><thead><tr><th>RIR</th><th>Ce que tu ressens</th><th class="n">RPE</th></tr></thead><tbody>
      <tr><td><b>0</b></td><td>Échec : impossible de faire une rep de plus proprement</td><td class="n">10</td></tr>
      <tr><td><b>1</b></td><td>Encore 1 rep, et elle aurait été très lente</td><td class="n">9</td></tr>
      <tr><td><b>2</b></td><td>Encore 2 reps, la dernière était nettement plus lente</td><td class="n">8</td></tr>
      <tr><td><b>3</b></td><td>Difficile mais contrôlé, vitesse encore correcte</td><td class="n">7</td></tr>
      <tr><td><b>4+</b></td><td>Confortable : échauffement ou charge trop légère</td><td class="n">≤ 6</td></tr></tbody></table></div></div>
  <div class="card"><h3>Exemples concrets</h3><div class="list">
    <div class="li"><div class="main"><div class="title">Presse à cuisses, 100 kg × 10</div><div class="sub">La 10e rep était lente mais propre. Une 11e passait sûrement, une 12e peut-être en luttant → note <b>RIR 1–2</b>. Si tu hésites, note 2 et compare la semaine suivante.</div></div></div>
    <div class="li"><div class="main"><div class="title">Curl EZ, 25 kg × 12</div><div class="sub">Les 2 dernières reps ralentissent, tu commences à balancer le dos pour la 13e → la 13e n’aurait pas été propre : <b>RIR 0–1</b>. Pour l’exercice prévu à RIR 1, c’est correct.</div></div></div>
    <div class="li"><div class="main"><div class="title">Leg extension, 40 kg × 15</div><div class="sub">Facile, tu aurais pu en faire 20 → <b>RIR 5</b> : charge trop légère, augmente.</div></div></div>
    <div class="li"><div class="main"><div class="title">Développé machine (épaule), 30 kg × 10</div><div class="sub">Ici on reste à <b>RIR 3</b> volontairement : sur les exercices orange, on ne s’approche pas de l’échec.</div></div></div></div></div>
  <div class="card"><h3>Mini-calculateur</h3><div class="grid g2"><div class="field"><label class="f">Reps faites</label><input type="number" inputmode="numeric" id="rir-done" value="10"></div><div class="field"><label class="f">Reps max possibles (estimation)</label><input type="number" inputmode="numeric" id="rir-max" value="12"></div></div><div id="rir-out" class="hero-num" style="font-size:2rem">RIR 2</div></div>

function foodSearchList(q, scope) {
  const qq = (q || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let list;
  if (scope === 'recent') {
    const seen = new Set(); list = [];
    for (const e of allRecs('food').slice().reverse()) { if (e.foodId && !seen.has(e.foodId) && getFood(e.foodId)) { seen.add(e.foodId); list.push(getFood(e.foodId)); } if (list.length > 25) break; }
  } else if (scope === 'mine') list = S.core.customFoods.slice();
  else list = FOODS.concat(S.core.customFoods, Object.values(FF_INDEX));
  if (qq) list = list.filter(f => norm(f.name + ' ' + (f.resto ? FASTFOOD[f.resto].name : '')).includes(qq));
  return list.slice(0, 60);
}

function sheetFastFood() {

function ffTotals() { const F = UI.ff; let t = { ...ZERO }; for (const [id, q] of Object.entries(F.order)) if (q > 0) t = addM(t, macrosFor(FF_INDEX[id], q)); return t; }
function ffSuggestions() {
  const F = UI.ff; const items = Object.entries(F.order).filter(([, q]) => q > 0).map(([id, q]) => ({ ...FF_INDEX[id], q }));
  if (!items.length) return [];
  const out = []; const resto = FASTFOOD[items[0].resto];
  const mains = resto.items.filter(i => i.type === 'main');
  const pd100 = i => i.p / i.kcal * 100;
  const mainItems = items.filter(i => i.type === 'main');
  const mainK = sum(mainItems, i => i.kcal * i.q), mainP = sum(mainItems, i => i.p * i.q);
  if (mainItems.length) {
    const cands = mains.filter(m => m.kcal <= mainK + 80 && m.kcal >= mainK * 0.55 && pd100(m) > (mainP / mainK * 100) * 1.12 && !items.some(i => i.id === m.id && i.q === 1 && mainItems.length === 1));
    cands.sort((a, b) => pd100(b) - pd100(a));
    if (cands[0]) out.push(`Plat plus riche en protéines pour des calories proches : <b>${esc(cands[0].name)}</b> (${fmt(cands[0].kcal)} kcal · ${fmt1(cands[0].p)} g P) au lieu de ${fmt(mainK)} kcal · ${fmt1(mainP)} g P.`);
  }
  for (const s of items.filter(i => i.type === 'side' && i.size >= 2)) {
    const small = resto.items.filter(i => i.type === 'side' && i.size >= 1 && i.size < s.size && i.name.split('—')[0] === s.name.split('—')[0]).sort((a, b) => a.size - b.size)[0];
    if (small) out.push(`${esc(s.name)} → <b>${esc(small.name)}</b> : −${fmt(s.kcal - small.kcal)} kcal, même plaisir.`);
  }
  const salad = resto.items.find(i => i.type === 'side' && i.size === 0);
  if (salad && items.some(i => i.type === 'side' && i.size >= 1)) out.push(`Option : remplacer les frites par <b>${esc(salad.name)}</b> une fois sur deux.`);
  const t = ffTotals();
  if (t.p < 30) out.push(`Ce repas apporte ${fmt(t.p)} g de protéines : complète plus tard avec un skyr ou un fromage blanc 0 % (+15–20 g).`);
  return out;
}

      <div class="row" style="margin-top:10px;gap:8px"><label class="f" style="margin:0">Dose (g/j)</label><input type="text" inputmode="decimal" style="width:80px" data-c="crea-dose" value="${sp.creatineDose}"><button class="btn xs ghost" data-a="crea-stop">Arrêter le suivi</button></div>`

    <div class="divider"></div><div class="small text2"><b>Ce que dit la science</b> ${TAGS.ev}<ul style="padding-left:18px;margin:6px 0">
      <li>3–5 g/jour de créatine monohydrate suffisent pour saturer et maintenir les réserves (ISSN 2017). La phase de charge n’est pas nécessaire : sans elle, la saturation prend ≈ 3–4 semaines.</li>

  html += `<div class="card"><h3>Pas nécessaire pour toi</h3><p class="small text2">BCAA (inutiles si les protéines sont suffisantes), « brûleurs de graisse », boosters de testostérone, pré-workouts très dosés en caféine (sommeil déjà court). ${TAGS.coach} Avant tout autre complément, parle-en à un professionnel de santé.</p></div>`;

function shoppingList() {
  const agg = {};
  for (let i = 1; i <= 7; i++) for (const k of Object.keys(SLOT_LABEL)) {
    const v = (S.core.mealPlan[i] || {})[k]; if (!v || v === 'out') continue;
    const r = recipeById(v); if (!r) continue;
    for (const [fid, q] of r.ing) { agg[fid] = (agg[fid] || 0) + q / (r.portions || 1); }
  }
  return Object.entries(agg).map(([id, q]) => { const f = getFood(id); const cost = f && f.pr != null ? (f.per === 'u' ? f.pr * q : f.pr * q / 1000) : 0; return { id, f, q, cost }; }).filter(x => x.f).sort((a, b) => (a.f.cat || '').localeCompare(b.f.cat || '') || a.f.name.localeCompare(b.f.name));
}
function prettyQty(f, q) {
  if (f.per === 'u') return `${Math.ceil(q)} ${f.unit || 'u.'}`;
  if (f.id === 'tortilla') return `${Math.ceil(q / 62)} wraps`;
  if (f.id === 'pain_burger') return `${Math.ceil(q / 60)} pain(s)`;
  if (f.id === 'banane') return `${Math.ceil(q / 120)} banane(s)`;
  if (f.id === 'pomme') return `${Math.ceil(q / 150)} pomme(s)`;
  if (f.id === 'tomate') return `${Math.ceil(q / 120)} tomate(s)`;
  if (f.id === 'poivron') return `${Math.ceil(q / 160)} poivron(s)`;
  if (f.id === 'concombre') return `${Math.ceil(q / 300)} concombre(s)`;
  if (f.id === 'laitue') return `${Math.ceil(q / 250)} salade(s)`;
  if (q >= 1000) return `${fmt(q / 1000, 2)} kg`;
  return `${fmt(Math.ceil(q / 10) * 10)} g`;
}

  html += `<div class="card"><div class="card-head"><h3>Courbe de poids</h3></div>${seg('wrange', RANGES, UI.range, 'small')}<div id="w-chart"></div>
    <div class="small muted" style="margin-top:6px">Points = pesées ; ligne = moyenne glissante 7 jours. Rythme visé : +${fmt(t.gainLo, 2)} à +${fmt(t.gainHi, 2)} kg/semaine (0,25–0,5 % du poids, Iraki 2019) ${TAGS.ev}. Une variation de ± 0,5–1 kg d’un jour à l’autre est normale (eau, sel, glucides, digestion).${S.core.supp.creatineStart ? ` Créatine reprise le ${fdate(S.core.supp.creatineStart)} : +1–2 kg d’eau possibles les premières semaines.` : ''}</div></div>`;

  html += `<div class="card"><div class="card-head"><h3>Historique</h3></div>${ws.length ? allRecs('weights').slice().reverse().slice(0, 30).map(w => `<div class="entry"><div class="e-main"><div class="e-name">${fmt1(w.kg)} kg</div><div class="e-sub">${fdateLong(w.date)}${w.fat ? ` · MG ${fmt1(w.fat)} %` : ''}${w.muscle ? ` · muscle ${fmt1(w.muscle)} %` : ''}</div></div><button class="icon-btn" style="width:32px;height:32px" data-a="weight-del" data-id="${w.id}">${IC.trash}</button></div>`).join('') : `<div class="empty">Aucune pesée. Profil de départ : ${fmt1(p.weight)} kg (fourchette récente ${p.rangeLo}–${p.rangeHi} kg).</div>`}</div>`;

    ], empty: 'Aucune pesée sur cette période.' });

function viewCorrelations() {
  const perf = sessionPerfSeries();
  const pairs = [];
  for (const p of perf) { const r = recsOn('recovery', p.date)[0]; if (r && r.sleepH != null) pairs.push({ sleep: r.sleepH, fatigue: r.fatigue, perf: p.delta, date: p.date }); }
  const N = 14;
  let html = alertBox('info', `Les relations entre sommeil, récupération et performance ne s’affichent qu’à partir de <b>${N} séances</b> avec un check-in le même jour. En dessous, toute « corrélation » serait du bruit. ${TAGS.coach}`);
  html += `<div class="card"><div class="card-head"><h3>Données disponibles</h3><span class="meta">${pairs.length}/${N}</span></div>${barHTML(pairs.length, N)}<div class="small muted" style="margin-top:6px">Performance = variation du volume (kg × reps) par rapport à la séance précédente du même type.</div></div>`;
  if (pairs.length >= N) {
    const rS = pearson(pairs.map(p => p.sleep), pairs.map(p => p.perf));
    const fp = pairs.filter(p => p.fatigue != null); const rF = fp.length >= N ? pearson(fp.map(p => p.fatigue), fp.map(p => p.perf)) : null;
    const good = pairs.filter(p => p.sleep >= 7), bad = pairs.filter(p => p.sleep < 7);
    const interp = r => r == null ? 'non calculable' : Math.abs(r) < 0.1 ? 'aucune relation visible' : Math.abs(r) < 0.3 ? 'relation faible' : Math.abs(r) < 0.5 ? 'relation modérée' : 'relation forte';
    html += `<div class="card"><h3>Sommeil ↔ performance</h3><div class="grid g2" style="margin-top:10px"><div class="stat"><div class="label">Corrélation (r)</div><div class="value">${fmt(rS, 2)}</div><div class="foot">${interp(rS)} · n = ${pairs.length}</div></div><div class="stat"><div class="label">Perf. moyenne</div><div class="value" style="font-size:1rem">≥ 7 h : ${good.length ? (avg(good, p => p.perf) >= 0 ? '+' : '') + fmt1(avg(good, p => p.perf)) + ' %' : '–'}<br>&lt; 7 h : ${bad.length ? (avg(bad, p => p.perf) >= 0 ? '+' : '') + fmt1(avg(bad, p => p.perf)) + ' %' : '–'}</div><div class="foot">n = ${good.length} / ${bad.length}</div></div></div>
      ${rF != null ? `<div class="small" style="margin-top:10px">Fatigue ↔ performance : r = ${fmt(rF, 2)} (${interp(rF)}, n = ${fp.length}).</div>` : ''}
      <div class="small muted" style="margin-top:8px">Corrélation ≠ causalité. Avec moins de 30 observations, l’incertitude reste grande : utilise ces chiffres comme une piste, pas une preuve.</div></div>`;
  }
  html += `<div class="card"><div class="card-head"><h3>Sommeil et séances — 30 jours</h3></div><div id="cor-chart"></div><div class="small muted">Barres = sommeil la nuit précédant le check-in ; les jours de séance sont en couleur pleine.</div></div>`;
  return { html, after() {
    const bars = []; for (let i = 29; i >= 0; i--) { const d = addDays(today(), -i); const r = recsOn('recovery', d)[0]; const trained = recsOn('workouts', d).length > 0; bars.push({ label: fdate(d), value: r && r.sleepH || 0, color: 'var(--s-prot)', opacity: trained ? 1 : .4, tip: `<div class="tt-title">${fdateLong(d)}</div>${r && r.sleepH != null ? `<b>${fmt1(r.sleepH)} h</b>` : 'non noté'}${trained ? ' · séance' : ''}` }); }
    barChart($('#cor-chart'), { height: 150, bars, unit: 'h', yFmt: v => fmt(v), refs: [{ y: 7, label: '7 h' }], empty: 'Pas encore de check-ins.' });
  } };
}

let lastW = window.innerWidth;

function renderSyncPill() {

function go(tab, sub) {

/* ---------- Feuilles, confirmations, toast ---------- */

}
function closeSheet() {

let toastT;

/* ---------- Minuteur de repos ---------- */
const Rest = { end: 0, total: 0, label: '', beeped: false };
let audioCtx = null;
function unlockAudio() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { } }
function beep() {
  try { if (!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.0001, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5); o.start(); o.stop(audioCtx.currentTime + 0.55); } catch (e) { }
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { }
}
function startRest(sec, label) { Rest.end = Date.now() + sec * 1000; Rest.total = sec; Rest.label = label; Rest.beeped = false; updateRestBar(); }
function updateRestBar() {
  const el = $('#rest-bar'); if (!el) return;
  if (!Rest.end || !S.core.active) { el.classList.add('hidden'); return; }
  const left = Math.round((Rest.end - Date.now()) / 1000);
  el.classList.remove('hidden');
  const done = left <= 0;
  if (done && !Rest.beeped) { Rest.beeped = true; beep(); }
  el.innerHTML = `<div><div class="t">${done ? 'Go !' : fmtDur(left)}</div><div class="lbl">${done ? 'Repos terminé' : 'Repos · ' + esc(Rest.label)}</div></div><div style="flex:1"></div>
    <button class="btn sm" data-a="rest-adj" data-v="-15">−15 s</button><button class="btn sm" data-a="rest-adj" data-v="15">+15 s</button><button class="btn sm ${done ? 'primary' : 'ghost'}" data-a="rest-stop">${done ? 'OK' : 'Passer'}</button>
    <div class="prog" style="width:${Rest.total ? clamp(1 - left / Rest.total, 0, 1) * 100 : 100}%"></div>`;
}
setInterval(() => {
  if (S.core && S.core.active) { const t = $('#wk-timer'); if (t) t.textContent = fmtDur((Date.now() - S.core.active.startedAt) / 1000); }
  if (Rest.end) updateRestBar();
}, 1000);

  const a = { id: uid(), templateId: t.id, name: `${t.id} · ${t.name}`, date: today(), startedAt: Date.now(), exercises: [] };
  S.core.active = a;
  for (const e of t.ex) {
    const target = { sets: e.sets, lo: e.lo, hi: e.hi, rir: e.rir, rest: e.rest };
    const sg = suggestFor(e.id, target);
    a.exercises.push({ exId: e.id, target, pain: null, note: '', sets: Array.from({ length: e.sets }, () => ({ w: sg.weight ?? null, reps: null, rir: null, done: false })) });

let libT;
document.addEventListener('input', e => {
  const t = e.target; const c = t.dataset && t.dataset.c; if (!c) return;
  if (c === 'set-w' || c === 'set-r') { const ex = activeEx(t.dataset.i); if (!ex) return; const s = ex.sets[+t.dataset.j]; const v = num(t.value); if (c === 'set-w') s.w = v; else s.reps = v != null ? Math.round(v) : null; touchCore(); }
  else if (c === 'lib-q') { UI.libQ = t.value; clearTimeout(libT); libT = setTimeout(() => { render(); const i = $('[data-c="lib-q"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
  else if (c === 'af-ov') { const Af = UI.addFood; Af.override = Af.override || macrosFor(Af.food, Af.qty); const v = num(t.value); if (v != null) Af.override[t.dataset.k] = v; $('#af-preview').innerHTML = macroLine(Af.override); }
  else if (c === 'ck-num') { const v = num(t.value); UI.ck[t.dataset.k] = v; }
  else if (c === 'ck-text') UI.ck[t.dataset.k] = t.value;
  else if (c === 'tg-range') { const v = +t.value; S.core.targets[t.dataset.k] = v; const l = $('#lbl-' + t.dataset.k); if (l) l.textContent = t.dataset.k === 'protGkg' ? fmt1(v) + ' g/kg' : v + ' %'; touchCore(); }
  else if (c === 'tg-man') { const v = num(t.value); if (v != null) { S.core.targets.manual[t.dataset.k] = v; touchCore(); } }
  else if (c === 'tg-num') { const v = num(t.value); if (v != null) { S.core.targets[t.dataset.k] = v; touchCore(); } }
  else if (c === 'crea-dose') { const v = num(t.value); if (v) { S.core.supp.creatineDose = v; touchCore(); } }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'ph-file' && t.files && t.files[0]) {
    try { toast('Compression de la photo…'); const data = await compressImage(t.files[0]); const id = uid(); S.photos[id] = { id, date: $('#ph-date').value || today(), view: $('#ph-view').value, data }; Store.touch('p-' + id); render(); toast(Store.lsPhotoFail && !Sync.db ? 'Photo ajoutée (stockage du navigateur plein : exporte une sauvegarde)' : 'Photo ajoutée ✓'); }
    catch (err) { toast('Impossible de lire cette image.'); }
    return;
  }
  if (t.id === 'imp-file' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => handleImport(String(r.result)); r.readAsText(t.files[0]); t.value = ''; return; }
  const c = t.dataset && t.dataset.c; if (!c) return;
  if (c === 'tpl-day') { tplById(t.dataset.id).day = +t.value; touchCore(); render(); }
  else if (c === 'hist-ex') { UI.histEx = t.value; render(); }
  else if (c === 'meas-k') { UI.measK = t.value; render(); }
  else if (c === 'plan-slot') { const d = t.dataset.day; S.core.mealPlan[d] = S.core.mealPlan[d] || {}; S.core.mealPlan[d][t.dataset.slot] = t.value; touchCore(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (c === 'shop-ck') { if (t.checked) S.core.shopping.checked[t.dataset.id] = true; else delete S.core.shopping.checked[t.dataset.id]; touchCore(); t.closest('.check-item').classList.toggle('done', t.checked); }

  else if (c === 'ck-rest') UI.ck.rest = t.checked;
  else if (c === 'tg-range' || c === 'tg-man' || c === 'tg-num') { const y = window.scrollY; render(); window.scrollTo(0, y); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushLocal(); else if (S.core.active) { updateRestBar(); keepAwake(); } });

  if (window.FOS_PWA) { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { } if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { }); }
}
boot();

/* ============================================================
   FITNESS OS — Scanner de code-barres + Open Food Facts
   ============================================================ */
SOURCES.off = { label: 'Open Food Facts (base collaborative, valeurs pour 100 g) — vérifie avec l’étiquette', rel: 'moyenne' };
const ZXING_URL = window.FOS_PWA ? 'zxing.min.js' : 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
const OFF_FIELDS = 'code,product_name,product_name_fr,brands,quantity,product_quantity,serving_size,serving_quantity,nutriments,image_front_small_url';
const Scan = { reader: null, active: false, busy: false };
function loadScript(src) { return new Promise((res, rej) => { if (document.querySelector(`script[data-src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.dataset.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); }); }
async function zxingReader() {
  if (!window.ZXing) await loadScript(ZXING_URL);
  const Z = window.ZXing; const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  return new Z.BrowserMultiFormatReader(hints, 300);
}
const r1 = v => v == null || !isFinite(v) ? null : Math.round(v * 10) / 10;
function offToFood(p, code) {
  const n = p.nutriments || {};
  let kcal = n['energy-kcal_100g']; if (kcal == null && n.energy_100g != null) kcal = n.energy_100g / 4.184;
  const name = (p.product_name_fr || p.product_name || '').trim() || 'Produit ' + code;
  const brand = (p.brands || '').split(',')[0].trim();
  const sv = []; const pq = num(p.product_quantity); const sq = num(p.serving_quantity);
  if (pq && pq > 0 && pq < 5000) sv.push([`Paquet entier (${p.quantity || Math.round(pq) + ' g'})`, Math.round(pq)]);
  if (sq && sq > 0 && Math.round(sq) !== Math.round(pq || 0)) sv.push([`1 portion (${p.serving_size || Math.round(sq) + ' g'})`, Math.round(sq)]);
  if (pq && pq > 0 && pq < 5000) sv.push([`½ paquet`, Math.round(pq / 2)]);
  sv.push(['100 g', 100]);
  const food = { id: 'off_' + code, barcode: code, name: brand && !name.toLowerCase().includes(brand.toLowerCase()) ? `${name} (${brand})` : name, cat: 'snack', per: 'g',
    kcal: r1(kcal), p: r1(n.proteins_100g), c: r1(n.carbohydrates_100g), f: r1(n.fat_100g), src: 'off', sv, img: p.image_front_small_url || null, added: today() };
  food.partial = [food.kcal, food.p, food.c, food.f].some(v => v == null);
  return food;
}
async function lookupBarcode(code) {
  code = String(code).replace(/\D/g, '');
  const local = S.core.customFoods.find(f => f.barcode === code);
  if (local) return { food: local, local: true };
  if (!navigator.onLine) return { offline: true, code };
  try {
    const res = await timeout(fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`), 12000);
    const j = await res.json();
    if (!j || j.status !== 1 || !j.product) return { notFound: true, code };
    return { food: offToFood(j.product, code), code };
  } catch (e) { return { error: true, code }; }
}
function stopScan() { Scan.active = false; clearTimeout(Scan.timer); try { Scan.stream && Scan.stream.getTracks().forEach(t => t.stop()); } catch (e) { } Scan.stream = null; }
function sheetScan(meal) {
  UI.scanMeal = meal || guessMeal();
  openSheet(`<div class="sheet-head"><h2>Scanner un produit</h2><button class="icon-btn" data-a="close-sheet">${IC.x}</button></div>
    <div id="scan-cam" class="scan-cam"><video id="scan-video" playsinline muted></video><div class="scan-frame"></div><div class="scan-msg" id="scan-msg">Démarrage de la caméra…</div></div>
    <div class="row wrap" style="gap:8px;margin:10px 0"><label class="btn sm" style="cursor:pointer">${IC.camera} Photo du code-barres<input type="file" accept="image/*" capture="environment" id="scan-file" style="display:none"></label></div>
    <div class="field"><label class="f">Ou tape les chiffres sous le code-barres</label><div class="inline-input"><input type="text" inputmode="numeric" id="scan-code" placeholder="ex. 3017620422003" autocomplete="off"><button class="btn primary" data-a="scan-lookup">Chercher</button></div></div>
    <div id="scan-result"></div>
    <p class="small muted">Données : Open Food Facts, base collaborative qui couvre la plupart des produits des supermarchés français. Connexion nécessaire pour un nouveau produit ; ensuite il est enregistré dans « Mes aliments ».</p>`, () => startCamera());
}
async function startCamera() {
  const msg = t => { const m = $('#scan-msg'); if (m) m.textContent = t; };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('#scan-cam') && $('#scan-cam').classList.add('off'); msg('Caméra indisponible ici : prends une photo du code-barres ou tape les chiffres.'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $('#scan-video'); if (!v) { stream.getTracks().forEach(t => t.stop()); return; }
    Scan.stream = stream; v.srcObject = stream; v.muted = true; v.setAttribute('playsinline', ''); await v.play().catch(() => { });
    Scan.reader = await zxingReader(); Scan.active = true; msg('Vise le code-barres, à 10–15 cm');
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
    const loop = () => {
      if (!Scan.active) return;
      if (v.readyState >= 2 && v.videoWidth && !Scan.busy) {
        try { cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v, 0, 0, cv.width, cv.height); const Z = window.ZXing; const res = Scan.reader.decodeBitmap(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))); if (res) { Scan.busy = true; const code = res.getText(); stopScan(); try { navigator.vibrate && navigator.vibrate(80); } catch (e) { } onBarcode(code).finally(() => { Scan.busy = false; }); return; } } catch (e) { }
      }
      Scan.timer = setTimeout(loop, 200);
    };
    loop();
  } catch (e) {
    Scan.active = false; $('#scan-cam') && $('#scan-cam').classList.add('off');
    msg(e && e.name === 'NotAllowedError' ? 'Accès à la caméra refusé. Autorise-le dans Réglages iPhone > Safari > Caméra, ou utilise la photo / les chiffres.' : 'Caméra indisponible ici : prends une photo du code-barres ou tape les chiffres.');
  }
}
async function decodePhoto(file) {
  const out = $('#scan-result'); if (out) out.innerHTML = `<div class="empty">Lecture du code-barres…</div>`;
  try {
    const reader = await zxingReader(); const url = URL.createObjectURL(file);
    const res = await reader.decodeFromImageUrl(url); URL.revokeObjectURL(url);
    await onBarcode(res.getText());
  } catch (e) { if (out) out.innerHTML = alertBox('warn', 'Code-barres illisible sur cette photo. Rapproche-toi, évite les reflets, ou tape les chiffres.'); }
}
async function onBarcode(code) {
  const out = $('#scan-result'); if (!out) return;
  stopScan(); const cam = $('#scan-cam'); if (cam) cam.classList.add('off');
  const c = $('#scan-code'); if (c) c.value = code;
  out.innerHTML = `<div class="empty">Recherche du produit ${esc(code)}…</div>`;
  const r = await lookupBarcode(code);
  UI.scanRes = r;
  if (r.food) {
    const f = r.food;
    out.innerHTML = `<div class="card tight"><div class="row" style="gap:12px;align-items:flex-start">${f.img ? `<img src="${esc(f.img)}" alt="" style="width:64px;height:64px;object-fit:contain;border-radius:10px;background:#fff" onerror="this.remove()">` : ''}<div style="flex:1;min-width:0"><b>${esc(f.name)}</b><div class="small muted">Code ${esc(f.barcode || code)}${r.local ? ' · déjà dans tes aliments' : ''}</div></div></div>
      <div class="small muted" style="margin-top:8px">Pour 100 g</div>${f.partial ? alertBox('warn', 'Valeurs incomplètes dans la base : complète-les avec l’étiquette.') : macroLine(f)}
      <div class="row wrap" style="gap:6px;margin-top:6px">${relChip(f.src)}</div>
      <div class="row" style="gap:8px;margin-top:10px">${f.partial ? `<button class="btn primary" style="flex:1" data-a="scan-complete">Compléter avec l’étiquette</button>` : `<button class="btn primary" style="flex:1" data-a="scan-use">Choisir la quantité</button><button class="btn" data-a="scan-complete">Corriger</button>`}</div></div>`;
  } else if (r.notFound || r.offline || r.error) {
    out.innerHTML = alertBox('warn', r.notFound ? `Produit ${esc(code)} inconnu d’Open Food Facts. Recopie les valeurs de l’étiquette : il sera reconnu au prochain scan.` : r.offline ? 'Pas de connexion : recopie les valeurs de l’étiquette, ou réessaie quand tu as du réseau.' : 'La base n’a pas répondu. Réessaie, ou recopie l’étiquette.') +
      `<div class="row" style="gap:8px"><button class="btn primary" style="flex:1" data-a="scan-complete">Saisir l’étiquette</button><button class="btn" data-a="scan-retry">Rescanner</button></div>`;
  }
}
function saveScannedFood(f) {
  const i = S.core.customFoods.findIndex(x => x.id === f.id || (f.barcode && x.barcode === f.barcode));
  const clean = Object.assign({}, f); delete clean.partial;
  if (i >= 0) S.core.customFoods[i] = Object.assign(S.core.customFoods[i], clean); else S.core.customFoods.push(clean);
  touchCore(); return S.core.customFoods.find(x => x.id === clean.id) || clean;
}
function labelForm(prefill) {
  const p = prefill || {};
  openSheet(`<div class="sheet-head"><h2>Valeurs de l’étiquette</h2><button class="icon-btn" data-a="close-sheet">${IC.x}</button></div>
    <p class="small muted">Recopie le tableau nutritionnel, colonne <b>« pour 100 g »</b>. ${p.barcode ? `Code ${esc(p.barcode)} : le produit sera reconnu au prochain scan.` : ''}</p>
    <div class="field"><label class="f">Nom du produit</label><input type="text" id="lf-name" value="${esc(p.name && !/^Produit \d+$/.test(p.name) ? p.name : '')}" placeholder="ex. Salade poulet César Monoprix"></div>
    <div class="grid g2">${[['kcal', 'Énergie (kcal)'], ['p', 'Protéines (g)'], ['c', 'Glucides (g)'], ['f', 'Matières grasses (g)']].map(([k, l]) => `<div class="field"><label class="f">${l}</label><input type="text" inputmode="decimal" id="lf-${k}" value="${p[k] ?? ''}"></div>`).join('')}
    <div class="field"><label class="f">Poids du paquet (g)</label><input type="text" inputmode="decimal" id="lf-pack" value="${(p.sv || []).find(s => /Paquet/.test(s[0])) ? (p.sv.find(s => /Paquet/.test(s[0]))[1]) : ''}" placeholder="ex. 250"></div>
    <div class="field"><label class="f">Prix (€, optionnel)</label><input type="text" inputmode="decimal" id="lf-price" value="${p.pr ?? ''}"></div></div>
    <p class="small muted">Si l’étiquette donne seulement l’énergie en kJ, divise par 4,18 pour obtenir les kcal.</p>
    <button class="btn primary block lg" data-a="scan-label-save">Enregistrer et choisir la quantité</button>`);

A['scan'] = t => { if (UI.tab !== 'nutrition') UI.nutDate = today(); sheetScan(t.dataset.meal); };
A['scan-lookup'] = () => { const v = ($('#scan-code').value || '').replace(/\D/g, ''); if (v.length < 8) return toast('Le code-barres fait 8 ou 13 chiffres.'); onBarcode(v); };
A['scan-retry'] = () => sheetScan(UI.scanMeal);

  const p = UI.labelPrefill || {}; const name = $('#lf-name').value.trim(); const kcal = num($('#lf-kcal').value);
  if (!name || kcal == null) return toast('Nom et énergie (kcal) obligatoires.');
  const pack = num($('#lf-pack').value); const sv = []; if (pack) { sv.push([`Paquet entier (${Math.round(pack)} g)`, Math.round(pack)]); sv.push(['½ paquet', Math.round(pack / 2)]); } sv.push(['100 g', 100]);
  const f = { id: p.id || (p.barcode ? 'off_' + p.barcode : 'cf_' + uid()), barcode: p.barcode || null, name, cat: 'snack', per: 'g', kcal, p: num($('#lf-p').value) || 0, c: num($('#lf-c').value) || 0, f: num($('#lf-f').value) || 0, pr: num($('#lf-price').value) && pack ? num($('#lf-price').value) / pack * 1000 : null, src: 'custom', sv, added: today() };

document.addEventListener('change', e => { if (e.target.id === 'scan-file' && e.target.files && e.target.files[0]) { stopScan(); decodePhoto(e.target.files[0]); } });
